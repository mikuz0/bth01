<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <style>
      .pin-line { stroke: #800000; stroke-width: 1.5; fill: none; }
      .pin-text { fill: #000; font-size: 9px; font-family: sans-serif; }
      .pin-num { fill: #000; font-size: 8px; font-family: sans-serif; text-anchor: middle; }
      .body { fill: #FFFFCC; stroke: #000; stroke-width: 1.5; }
      .label { fill: #000; font-size: 10px; font-family: sans-serif; }
    </style>
  </defs>

  <!-- IC Body: 450x450 centered -->
  <rect x="75" y="75" width="450" height="450" class="body" rx="2"/>

  <!-- ================= TOP PINS (y=0) ================= -->
  <!-- 7 pins: 33 GND, 32 P34, 31 P33, 30 P32, 29 P31, 28 P26, 27 P25 -->
  <g>
    <line x1="95" y1="75" x2="95" y2="0" class="pin-line"/>
    <text x="95" y="-10" class="pin-num">33</text>
    <text x="95" y="95" class="pin-text" text-anchor="middle" transform="rotate(-90 95 95)">GND</text>
  </g>
  <g>
    <line x1="155" y1="75" x2="155" y2="0" class="pin-line"/>
    <text x="155" y="-10" class="pin-num">32</text>
    <text x="155" y="95" class="pin-text" text-anchor="middle" transform="rotate(-90 155 95)">P34</text>
  </g>
  <g>
    <line x1="215" y1="75" x2="215" y2="0" class="pin-line"/>
    <text x="215" y="-10" class="pin-num">31</text>
    <text x="215" y="95" class="pin-text" text-anchor="middle" transform="rotate(-90 215 95)">P33</text>
  </g>
  <g>
    <line x1="275" y1="75" x2="275" y2="0" class="pin-line"/>
    <text x="275" y="-10" class="pin-num">30</text>
    <text x="275" y="95" class="pin-text" text-anchor="middle" transform="rotate(-90 275 95)">P32</text>
  </g>
  <g>
    <line x1="335" y1="75" x2="335" y2="0" class="pin-line"/>
    <text x="335" y="-10" class="pin-num">29</text>
    <text x="335" y="95" class="pin-text" text-anchor="middle" transform="rotate(-90 335 95)">P31</text>
  </g>
  <g>
    <line x1="395" y1="75" x2="395" y2="0" class="pin-line"/>
    <text x="395" y="-10" class="pin-num">28</text>
    <text x="395" y="95" class="pin-text" text-anchor="middle" transform="rotate(-90 395 95)">P26</text>
  </g>
  <g>
    <line x1="455" y1="75" x2="455" y2="0" class="pin-line"/>
    <text x="455" y="-10" class="pin-num">27</text>
    <text x="455" y="95" class="pin-text" text-anchor="middle" transform="rotate(-90 455 95)">P25</text>
  </g>

  <!-- ================= LEFT PINS (x=0) ================= -->
  <!-- 8 pins: 1 P0, 2 P1, 3 P2, 4 P3, 5 VDDDEC, 6 P7, 7 TM, 8 P9 -->
  <g>
    <line x1="75" y1="120" x2="0" y2="120" class="pin-line"/>
    <text x="-10" y="123" class="pin-num" text-anchor="end">1</text>
    <text x="95" y="123" class="pin-text">P0</text>
  </g>
  <g>
    <line x1="75" y1="175" x2="0" y2="175" class="pin-line"/>
    <text x="-10" y="178" class="pin-num" text-anchor="end">2</text>
    <text x="95" y="178" class="pin-text">P1</text>
  </g>
  <g>
    <line x1="75" y1="230" x2="0" y2="230" class="pin-line"/>
    <text x="-10" y="233" class="pin-num" text-anchor="end">3</text>
    <text x="95" y="233" class="pin-text">P2</text>
  </g>
  <g>
    <line x1="75" y1="285" x2="0" y2="285" class="pin-line"/>
    <text x="-10" y="288" class="pin-num" text-anchor="end">4</text>
    <text x="95" y="288" class="pin-text">P3</text>
  </g>
  <g>
    <line x1="75" y1="340" x2="0" y2="340" class="pin-line"/>
    <text x="-10" y="343" class="pin-num" text-anchor="end">5</text>
    <text x="95" y="343" class="pin-text">VDDDEC</text>
  </g>
  <g>
    <line x1="75" y1="395" x2="0" y2="395" class="pin-line"/>
    <text x="-10" y="398" class="pin-num" text-anchor="end">6</text>
    <text x="95" y="398" class="pin-text">P7</text>
  </g>
  <g>
    <line x1="75" y1="450" x2="0" y2="450" class="pin-line"/>
    <text x="-10" y="453" class="pin-num" text-anchor="end">7</text>
    <text x="95" y="453" class="pin-text">TM</text>
  </g>
  <g>
    <line x1="75" y1="505" x2="0" y2="505" class="pin-line"/>
    <text x="-10" y="508" class="pin-num" text-anchor="end">8</text>
    <text x="95" y="508" class="pin-text">P9</text>
  </g>

  <!-- ================= RIGHT PINS (x=600) ================= -->
  <!-- 10 pins: 25 P23, 26 P24, 24 RF, 23 VDD_RF, 22 RST_N, 21 P20, 20 P18, 19 P17, 18 P16, 17 XC2 -->
  <!-- y: 100, 145, 190, 235, 280, 325, 370, 415, 460, 505 -->
  <g>
    <line x1="525" y1="100" x2="600" y2="100" class="pin-line"/>
    <text x="610" y="103" class="pin-num" text-anchor="start">25</text>
    <text x="505" y="103" class="pin-text" text-anchor="end">P23</text>
  </g>
  <g>
    <line x1="525" y1="145" x2="600" y2="145" class="pin-line"/>
    <text x="610" y="148" class="pin-num" text-anchor="start">26</text>
    <text x="505" y="148" class="pin-text" text-anchor="end">P24</text>
  </g>
  <g>
    <line x1="525" y1="190" x2="600" y2="190" class="pin-line"/>
    <text x="610" y="193" class="pin-num" text-anchor="start">24</text>
    <text x="505" y="193" class="pin-text" text-anchor="end">RF</text>
  </g>
  <g>
    <line x1="525" y1="235" x2="600" y2="235" class="pin-line"/>
    <text x="610" y="238" class="pin-num" text-anchor="start">23</text>
    <text x="505" y="238" class="pin-text" text-anchor="end">VDD_RF</text>
  </g>
  <g>
    <line x1="525" y1="280" x2="600" y2="280" class="pin-line"/>
    <text x="610" y="283" class="pin-num" text-anchor="start">22</text>
    <text x="505" y="283" class="pin-text" text-anchor="end">RST_N</text>
  </g>
  <g>
    <line x1="525" y1="325" x2="600" y2="325" class="pin-line"/>
    <text x="610" y="328" class="pin-num" text-anchor="start">21</text>
    <text x="505" y="328" class="pin-text" text-anchor="end">P20</text>
  </g>
  <g>
    <line x1="525" y1="370" x2="600" y2="370" class="pin-line"/>
    <text x="610" y="373" class="pin-num" text-anchor="start">20</text>
    <text x="505" y="373" class="pin-text" text-anchor="end">P18</text>
  </g>
  <g>
    <line x1="525" y1="415" x2="600" y2="415" class="pin-line"/>
    <text x="610" y="418" class="pin-num" text-anchor="start">19</text>
    <text x="505" y="418" class="pin-text" text-anchor="end">P17</text>
  </g>
  <g>
    <line x1="525" y1="460" x2="600" y2="460" class="pin-line"/>
    <text x="610" y="463" class="pin-num" text-anchor="start">18</text>
    <text x="505" y="463" class="pin-text" text-anchor="end">P16</text>
  </g>
  <g>
    <line x1="525" y1="505" x2="600" y2="505" class="pin-line"/>
    <text x="610" y="508" class="pin-num" text-anchor="start">17</text>
    <text x="505" y="508" class="pin-text" text-anchor="end">XC2</text>
  </g>

  <!-- ================= BOTTOM PINS (y=600) ================= -->
  <!-- 8 pins: 9 P10, 10 P11, 11 P14, 12 VDD_LDO, 13 DCDC_SW, 14 DCDC_OUT, 15 VDD3, 16 XC1 -->
  <g>
    <line x1="85" y1="525" x2="85" y2="600" class="pin-line"/>
    <text x="85" y="615" class="pin-num">9</text>
    <text x="85" y="505" class="pin-text" text-anchor="middle" transform="rotate(-90 85 505)">P10</text>
  </g>
  <g>
    <line x1="145" y1="525" x2="145" y2="600" class="pin-line"/>
    <text x="145" y="615" class="pin-num">10</text>
    <text x="145" y="505" class="pin-text" text-anchor="middle" transform="rotate(-90 145 505)">P11</text>
  </g>
  <g>
    <line x1="205" y1="525" x2="205" y2="600" class="pin-line"/>
    <text x="205" y="615" class="pin-num">11</text>
    <text x="205" y="505" class="pin-text" text-anchor="middle" transform="rotate(-90 205 505)">P14</text>
  </g>
  <g>
    <line x1="265" y1="525" x2="265" y2="600" class="pin-line"/>
    <text x="265" y="615" class="pin-num">12</text>
    <text x="265" y="505" class="pin-text" text-anchor="middle" transform="rotate(-90 265 505)">VDD_LDO</text>
  </g>
  <g>
    <line x1="325" y1="525" x2="325" y2="600" class="pin-line"/>
    <text x="325" y="615" class="pin-num">13</text>
    <text x="325" y="505" class="pin-text" text-anchor="middle" transform="rotate(-90 325 505)">DCDC_SW</text>
  </g>
  <g>
    <line x1="385" y1="525" x2="385" y2="600" class="pin-line"/>
    <text x="385" y="615" class="pin-num">14</text>
    <text x="385" y="505" class="pin-text" text-anchor="middle" transform="rotate(-90 385 505)">DCDC_OUT</text>
  </g>
  <g>
    <line x1="445" y1="525" x2="445" y2="600" class="pin-line"/>
    <text x="445" y="615" class="pin-num">15</text>
    <text x="445" y="505" class="pin-text" text-anchor="middle" transform="rotate(-90 445 505)">VDD3</text>
  </g>
  <g>
    <line x1="505" y1="525" x2="505" y2="600" class="pin-line"/>
    <text x="505" y="615" class="pin-num">16</text>
    <text x="505" y="505" class="pin-text" text-anchor="middle" transform="rotate(-90 505 505)">XC1</text>
  </g>

</svg>